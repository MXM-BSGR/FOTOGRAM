<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/icons/favicon-plain.svg" type="image/svg+xml">
    <title>SPLASHCORE Fotogram</title> <!-- update later -->
    <!-- #region  LINKS  -->
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/media-querries.css">
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->
    <!-- #region  SCRIPT  -->
    <script defer src="./js/templates.js"></script>
    <script defer src="./script.js"></script>
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->
</head>

<body onload="init()">
    <!--__________  HEADER  __________-->
    <header class="MainHeader">

        <div id="idMainHeaderWrapper" class="MainHeaderWrapper">
            <!-- <img id="idHeaderLogoIcon" class="LogoIcon" src="./assets/icons/favicon-plain.svg" alt="logoIcon"> -->
            <img id="idHeaderLogo" class="LogoHeader" src="./assets/img/splashcore-logo.svg" alt="lettering">
        </div>

    </header>

    <!-- ------------------------------------------------------------- -->

    <!-- __________  MAIN   __________-->
    <main id="idMainContent">

        <h1 id="idHeading" class="WebsiteHeading">My favorite Paintings by Pierromaniac</h1>
        <section id="idThumbnailWrapper" class="ThumbnailWrapper"></section>
        <dialog id="idLightBox" class="LightBox" aria-labeledby="idDialogTitle" aria-describedby="idDetailedDescription"
            onclick="closeDialog()"></dialog>

    </main>

    <!-- ------------------------------------------------------------- -->

    <!-- __________  FOOTER  __________-->
    <footer class="MainFooter">

        <img id="idFooterLogo" class="LogoFooter" src="./assets/img/splashcore-logo.svg" alt="banner">

        <p id="idCopyrightText" class="TextCopyright">&copy; 2026 SplashCore by Pierromaniac</p>
    </footer>


    <!-- ------------------------------------------------------------- -->

</body>

</html>
