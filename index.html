<body>

    <!-- #region__________  HEADER  __________-->
    <header>
        <img id="idHeaderLogoIcon" class="LogoIcon" src="./assets/icons/" alt="logo"> <!-- update later -->
        <img id="idHeaderLogo" class="LogoHeader" src="./assets/img/" alt="schriftzug"> <!-- update later -->

    </header>

    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->

    <!-- #region__________  MAIN   __________-->
    <main>
        <h1 id="idHeading" class="WebsiteHeading">My favorite Paintings by Pierromaniac</h1>
        <section id="idThumbnailWrapper" class="ThumbnailWrapper">

            <!-- probe design -->
            <button id="idThumbnailOne" type="button" class="Thumbnail" onclick="openDialog()">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>
            <button type="button" class="Thumbnail" onclick="openDialog()">BILD</button>
            <button type="button" class="Thumbnail">BILD</button>

            <!-- #region__________  DIALOG __________-->

            <dialog id="idLightBox" class="LightBox">

                <header class="DialogHeader">
                    <h2 class="TitleOfImage">Img title of Array index</h2>
                    <button id="idCloseButton" class="CloseButton" type="button" onclick="closeDialog()">
                        <!-- <img id="idDisplayCloseButtonIcon" class="CloseButtonIcon" src="./assets/icons/"> -->
                    </button>
                </header>

                <figure id="idFullSizeImageArea" class="FullSizeImageArea">
                    <img id="idFullsizeImage" class="ImageFullSize" src="./assets/img/"> <!-- src innerhtml variable -->
                </figure>

                <section id="idDisplayNavigationWrapper" class="DisplayNavigationWrapper">
                    <button id="idButtonToPreviousImage" class="NavigationButton">
                        <img id="idArrowPointingLeft" class="arrow left" src="./assets/icons/" alt="<">
                        <!-- update later -->
                    </button>
                    <p id="idIndexOfDisplayedImage" class="NavigationDisplay">1/12</p> <!-- created by js -->
                    <button id="idButtonToNextImage" class="NavigationButton">
                        <img id="idArrowPointingRight" class="arrow right" src="./assets/icons/" alt="<">
                        <!-- update later -->
                    </button>
                </section>

            </dialog>
            <!-- #endregion DIALOG-->
        </section>

    </main>
    <!-- #endregion -->

    <!-- ------------------------------------------------------------- -->

    <!-- #region__________  FOOTER  __________-->
    <footer>
        <img id="idFooterLogo" class="LogoFooter" src="./assets/img/" alt="schriftzug"> <!-- update later -->
        <section id="idCopyrightWrapper" class="CopyrightWrapper">
            <img id="idCopyrightIcon" class="CopyrightIcon" src="./assets/icons/" alt="Copyright Icon">
            <!-- update later -->
            <p id="idCopyrightText" class="TextCopyright">2026 SplashCore by Pierromaniac</p>
        </section>
    </footer>
